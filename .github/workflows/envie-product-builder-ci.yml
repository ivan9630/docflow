name: Envie Product Builder — demos CI
on:
  push:
    paths:
      - 'showcase/agent-diagnostic-envie/**'
      - 'showcase/automation-fiches-produits/**'
      - '.github/workflows/envie-product-builder-ci.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [agent-diagnostic-envie, automation-fiches-produits]
    defaults:
      run:
        working-directory: showcase/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q agent code 2>/dev/null || python -m compileall -q .
      - name: Test local deterministic mode
        run: python -m unittest discover -s tests -v
