name: Publish interactive portfolio demos

on:
  push:
    branches: [main]
    paths:
      - 'proofs/portfolio-live/**'
      - '.github/workflows/portfolio-live-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test project rules
        working-directory: proofs/portfolio-live
        run: |
          npm test
          npm run test:python
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: proofs/portfolio-live
      - id: deployment
        uses: actions/deploy-pages@v4
