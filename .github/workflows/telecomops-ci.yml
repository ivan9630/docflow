name: TelecomOps Java Angular CI
on:
  push:
    paths: ['showcase/telecomops-java-angular/**', '.github/workflows/telecomops-ci.yml']
  pull_request:
    paths: ['showcase/telecomops-java-angular/**', '.github/workflows/telecomops-ci.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/telecomops-java-angular/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: showcase/telecomops-java-angular/backend/pom.xml
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/telecomops-java-angular/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
