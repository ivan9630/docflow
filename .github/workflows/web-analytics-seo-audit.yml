name: Web Analytics and SEO audit checks
on:
  push:
    paths:
      - 'showcase/web-analytics-seo-audit/**'
      - '.github/workflows/web-analytics-seo-audit.yml'
  pull_request:
    paths:
      - 'showcase/web-analytics-seo-audit/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/web-analytics-seo-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate demo fixtures and reports
        run: |
          python -m scripts.generate_demo
          python -m scripts.monthly_report
          python -m scripts.seo_audit
          python -m scripts.benchmark
          python -m scripts.build_dashboard
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
