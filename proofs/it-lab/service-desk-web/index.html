<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Mini Service Desk — démonstrateur</title>
<style>body{font:18px system-ui;max-width:760px;margin:3rem auto;padding:1rem;background:#f4f6fa;color:#18263a}input,button{font:inherit;padding:.6rem}li{padding:.5rem}#status{min-height:2em}</style>
<h1>Mini Service Desk</h1><p>Exercice personnel : tickets fictifs, stockage en mémoire, aucune donnée réelle.</p>
<form id="form"><label for="title">Incident</label> <input id="title" maxlength="200" required><button>Créer</button></form>
<p id="status" role="status"></p><ul id="tickets"></ul>
<script>
const statusNode=document.querySelector('#status');
async function refresh(){
 const response=await fetch('/api/tickets');if(!response.ok)throw Error('Lecture impossible');
 const tickets=await response.json();document.querySelector('#tickets').replaceChildren(...tickets.map(t=>{
 const li=document.createElement('li');li.textContent='#'+t.id+' — '+t.title+' ('+t.status+')';return li;
 }));
}
document.querySelector('#form').addEventListener('submit',async event=>{
 event.preventDefault();
 try{const response=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({title:document.querySelector('#title').value})});
 const result=await response.json();if(!response.ok)throw Error(result.error);
 statusNode.textContent='Ticket créé';event.target.reset();await refresh();
 }catch(error){statusNode.textContent=error.message;}
});
refresh().catch(error=>statusNode.textContent=error.message);
</script></html>
