name: MissionFlow Java tests
on:
  push:
    paths:
      - 'showcase/missionflow360/**'
  pull_request:
    paths:
      - 'showcase/missionflow360/**'
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: bash test.sh
        working-directory: showcase/missionflow360
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: mvn -B -ntp test
        working-directory: showcase/missionflow360/spring-api
